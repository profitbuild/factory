# zizmor configuration; ci.yml's lint job runs zizmor with it. Every suppression names its reason and the condition
# that ends it. A finding suppressed on one line goes inline, next to that line, not here.
rules:
  # GitHub's `$/` self-repository syntax for local actions (July 2026) postdates the pinned actionlint, the same
  # pin as incident-platform's: adopting it now would fail actionlint in the same job. Turn this back on, and switch
  # the `uses: ./.github/actions/...` lines, once the pinned actionlint accepts `$/` (incident-platform #0-151).
  self-repository:
    disable: true
