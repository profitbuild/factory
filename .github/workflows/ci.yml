# ============================================================
# CI of the factory (backlog #0-267 of incident-platform, ADR-0060): the dispatcher's tests on the Node of
# .node-version, the workflow linters at incident-platform's pins, and the secret scan of every commit added
# (#0-268). The job names, `Test`, `Lint Workflows` and `Secret Scan`, are the required checks of main's ruleset once
# their first run has registered them (the owner adds each to the ruleset): from then on, renaming a job without
# changing the ruleset leaves every pull request waiting for ever. `Test (git 2.43)`, the dispatcher's tests on the
# build VM's git (incident-platform backlog #0-276), joins them once its pull request is merged. Its image (Docker Hub)
# and its git (Ubuntu's archive, apt's signed index) are sources the owner accepted for this CI (2026-11-20).
# ============================================================

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GITHUB_TOKEN scope is declared here, not left to the repository setting (that one is read-only too, and lives in
# the UI, where a change shows in no diff). Every scope not listed is `none`; no job here writes anything.
permissions:
  contents: read

# A new push to a pull request cancels that PR's run still in progress; a push to main is never cancelled, so
# main's every merge has its own result (each push its own group, `run_id`).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Every `uses:` names a full commit SHA with its tag in a comment; the repository requires it (SHA pinning) and
# allows GitHub's own actions only.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-node

      - name: The dispatcher's tests
        working-directory: dispatcher
        run: node --test

  test-git-2-43:
    name: Test (git 2.43)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Ubuntu 24.04's own git, 2.43.0: the build VM's (incident-platform backlog #0-276, AC6). The runner's git is newer.
    container: ubuntu:24.04@sha256:9c7f200c07e3d4a03e7249d2c16bf66a51120fb876aa2242cf31451412543289
    # In a container a run step's default shell is sh (dash, no pipefail); the image has bash.
    defaults:
      run:
        shell: bash
    steps:
      # The job's name is a fact, not a hope: any other upstream git than 2.43 fails it.
      - name: Install git
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
          version=$(git --version)
          echo "$version"
          case $version in
            "git version 2.43."*) ;;
            *) echo "::error::expected git 2.43 (the build VM's), got: $version"; exit 1 ;;
          esac

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: ./.github/actions/setup-node

      # The whole suite, not a list of files: a test that runs git, now or later, runs on the VM's git too.
      - name: The dispatcher's tests on git 2.43
        working-directory: dispatcher
        run: node --test

  lint:
    name: Lint Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # The same pins as incident-platform's lint-workflows job (its check-pinned-tools.sh proves them against their
    # publishers); a bump there is made here too until stage T makes one template.
    env:
      ACTIONLINT_VERSION: v1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
      ZIZMOR_VERSION: v1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint, shellcheck and zizmor (pinned, checksum verified)
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/lint-tools"
          .github/scripts/install-pinned-tool.sh --repo rhysd/actionlint --tag "$ACTIONLINT_VERSION" \
            --asset "actionlint_${ACTIONLINT_VERSION#v}_linux_amd64.tar.gz" --sha256 "$ACTIONLINT_SHA256" \
            --member actionlint --into "$tools"
          .github/scripts/install-pinned-tool.sh --repo koalaman/shellcheck --tag "$SHELLCHECK_VERSION" \
            --asset "shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" --sha256 "$SHELLCHECK_SHA256" \
            --member "shellcheck-${SHELLCHECK_VERSION}/shellcheck" --into "$tools"
          .github/scripts/install-pinned-tool.sh --repo zizmorcore/zizmor --tag "$ZIZMOR_VERSION" \
            --asset zizmor-x86_64-unknown-linux-gnu.tar.gz --sha256 "$ZIZMOR_SHA256" \
            --member zizmor --into "$tools"
          "${tools}/actionlint" -version
          "${tools}/shellcheck" --version
          "${tools}/zizmor" --version

      # -shellcheck names the pinned binary, so the runner's own shellcheck is never the one used.
      - name: Lint the workflows (actionlint)
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/lint-tools/actionlint" -shellcheck="${RUNNER_TEMP}/lint-tools/shellcheck"

      # Every tracked .sh file, every severity, --norc: no .shellcheckrc turns a check off; a finding that is meant
      # is disabled at its line, with its reason. --source-path=SCRIPTDIR, as incident-platform's check-shell.rb
      # passes it: a script's `source` of a file next to it is followed and checked, not reported as SC1091.
      - name: Shellcheck the scripts
        run: |
          set -euo pipefail
          git ls-files -z -- '*.sh' | xargs -0 --no-run-if-empty \
            "${RUNNER_TEMP}/lint-tools/shellcheck" --norc --severity=style --external-sources --source-path=SCRIPTDIR

      # Exits non-zero on any finding not suppressed; reads .github/zizmor.yml by itself.
      - name: Audit the workflows and actions (zizmor)
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/lint-tools/zizmor" --offline --persona regular --format github .

  # Secrets in the commits a pull request or a push adds (incident-platform backlog #0-268, its ADR-0036): the scan of
  # incident-platform's `secret-scan` job, its scripts copied unchanged but for their notice. Here before 4.2, since
  # from #0-269 on the commits are pushed by profitbuild-factory-dev from its devcontainer, and 4.2 brings the code that
  # handles builder-app's key. betterleaks needs no token and reads no secret: the job holds only the read-only
  # GITHUB_TOKEN of every job here, so the pull requests the app opens (same-repository, run without approval) reach
  # nothing more by it. The pin is incident-platform's (its check-pinned-tools.sh proves it against the publisher);
  # incident-platform's CI fails when the two differ (#0-268).
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      BETTERLEAKS_VERSION: v1.9.0
      BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7

    steps:
      # The full history: both ends of the range, and every commit between them, must be in the clone.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install betterleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          .github/scripts/install-pinned-tool.sh --repo betterleaks/betterleaks --tag "$BETTERLEAKS_VERSION" \
            --asset "betterleaks_${BETTERLEAKS_VERSION#v}_linux_x64.tar.gz" --sha256 "$BETTERLEAKS_SHA256" \
            --member betterleaks --into "${RUNNER_TEMP}/scan-tools"
          "${RUNNER_TEMP}/scan-tools/betterleaks" version

      # The script's own cases first, with the same binary, so a broken script cannot pass.
      - name: No secret in the commits
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
        run: |
          set -euo pipefail
          BETTERLEAKS="${RUNNER_TEMP}/scan-tools/betterleaks" .github/scripts/test-secret-scan.sh
          .github/scripts/secret-scan.sh "${RUNNER_TEMP}/scan-tools/betterleaks" "$FROM" "$TO"
